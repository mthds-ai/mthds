[project]
name = "mthds"
version = "5.0.0"
description = "MTHDS is the open standard for creating and sharing executable, composable AI methods."
authors = [{ name = "Evotis S.A.S.", email = "oss@pipelex.com" }]
maintainers = [{ name = "Pipelex", email = "oss@pipelex.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.15"

dependencies = [
  "mkdocs>=1.6.1",
  "mkdocs-glightbox>=0.4.0",
  "mkdocs-material>=9.6.14",
  "mkdocs-meta-manager>=1.1.0",
  "mike>=2.1.3",
  "mkdocs-llmstxt-md>=0.2.0",
  "neoteroi-mkdocs>=1.1.3",
  "openapi-spec-validator>=0.7.1",
  "jsonschema>=4.18.0",
  # `tomllib` is in the standard library from Python 3.11 on.
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://mthds.ai/latest/"
Repository = "https://github.com/mthds-ai/mthds"

[tool.mthds.docs]
# What mthds.ai serves, read by scripts/docs_retention.py; `make docs-retention` prints
# what the next deploy would keep and retire. Retiring is not reversible from the site —
# republishing means checking that tag out and deploying by hand.
#
# `floor` is the oldest version the site serves: every published version below it is
# retired, the release before the one being deployed included. 6.0.0 is the first version
# built with the cookie consent banner; every version before it starts PostHog without
# consent, so none of them is served.
#
# `retain` names versions kept beyond the release being deployed and the one before it,
# which are retained automatically. Each entry is an editorial decision that the site
# still answers for that standard, and an entry below `floor` stops the deploy.
floor = "6.0.0"
retain = []

[tool.uv]
required-version = ">=0.7.2"
