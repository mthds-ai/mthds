[project]
name = "mthds"
version = "2.1.0"
description = "MTHDS is the open standard for creating and sharing executable, composable AI methods."
authors = [{ name = "Evotis S.A.S.", email = "oss@pipelex.com" }]
maintainers = [{ name = "Pipelex", email = "oss@pipelex.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.15"

dependencies = [
  "mkdocs>=1.6.1",
  "mkdocs-glightbox>=0.4.0",
  "mkdocs-material>=9.6.14",
  "mkdocs-meta-manager>=1.1.0",
  "mike>=2.1.3",
  "mkdocs-llmstxt-md>=0.2.0",
  "neoteroi-mkdocs>=1.1.3",
  "openapi-spec-validator>=0.7.1",
]

[project.urls]
Homepage = "https://mthds.ai/latest/"
Repository = "https://github.com/mthds-ai/mthds"

[tool.mthds.docs]
# Versions mthds.ai keeps beyond the release being deployed and the one before it, which
# are retained automatically. Each entry here is an editorial decision that the site still
# answers for that standard. Dropping one retires it at the next deploy, and retiring is
# not reversible from the site — republishing means checking that tag out and deploying by
# hand. `make docs-retention` prints what the next deploy would keep and retire.
retain = ["0.10.0"]  # the last 0.x standard

[tool.uv]
required-version = ">=0.7.2"
