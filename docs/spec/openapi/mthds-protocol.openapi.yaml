openapi: 3.1.0
info:
  title: MTHDS Protocol
  version: 1.0.0
  summary: The minimal HTTP contract every MTHDS runner implements.
  description: >
    Five required routes, and two optional blob routes for a runner that keeps a blob
    store. Any server implementing the five required routes is an MTHDS-compliant
    runner. A runner executes and validates methods, each sent as its whole method
    tree, a map of file entries; it keeps no run store and owns no user, billing, or
    catalog concepts. Paths are relative to an implementation-chosen base URL.
    Implementations may extend the surface (extra routes, extra request properties)
    but must not change the meaning or shape of the protocol routes. All errors are
    RFC 7807 application/problem+json.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8081/v1
    description: Example — a self-hosted runner. The version segment belongs to the server base URL; protocol paths are version-agnostic.
  - url: https://api.example.com/v1
    description: Example — a hosted, protocol-compliant superset.
security:
  - bearer: []
  - {} # auth is implementation-defined; anonymous allowed self-hosted
tags:
  - name: run
    description: Execute methods, synchronously or asynchronously.
  - name: validate
    description: Static + dry-run validation of MTHDS bundles.
  - name: discovery
    description: What this runner is and what it can route to.
  - name: blobs
    description: >
      Optional. A runner whose /version declares blob_store true keeps a blob store
      (bytes keyed by their SHA-256, written once, never changed), so a sender uploads
      a file at most once and then sends it by hash.
paths:
  /execute:
    post:
      operationId: executeMethod
      tags: [run]
      summary: Execute a method synchronously and return its full output.
      description: >
        Blocking. The protocol sets no time limit; deployments cap it at their proxy
        layer. For long-running methods prefer /start. Implementations MAY return
        202 + RunResultStart (id only) with a Location header pointing at an
        implementation-defined status resource when they cannot hold the connection
        open for the full execution (RFC 9110 asynchronous pattern); clients that
        cannot handle 202 should use /start instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        '200':
          description: Method completed; full output included.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResultExecute' }
        '202':
          description: >
            OPTIONAL (implementations MAY emit this; simple runners never do):
            execution continues in the background. The Location header points at an
            implementation-defined status resource.
          headers:
            Location:
              schema: { type: string }
              description: Implementation-defined status resource for this run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResultStart' }
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'
  /start:
    post:
      operationId: startMethod
      tags: [run]
      summary: Start a method asynchronously; returns its pipeline_run_id immediately.
      description: >
        Asynchronous. Returns 202 + RunResultStart immediately (pipeline_run_id only); the
        runner keeps no run store, and how completion is later delivered (callbacks,
        polling, anything else) is implementation-defined and outside the protocol.
        The returned pipeline_run_id is always authoritative (server-generated).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        '202':
          description: Accepted; execution proceeds in the background.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResultStart' }
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'
  /validate:
    post:
      operationId: validateMethod
      tags: [validate]
      summary: Parse, validate, and dry-run an MTHDS bundle.
      description: >
        Diagnostic endpoint. Every verdict the validator can produce — valid or
        invalid — rides a 200, discriminated in the body on is_valid. Non-2xx is
        reserved for the cases where no verdict could be produced (a malformed
        request body, auth, a server fault), so a 422 here is a request-shape
        problem, never "the bundle is invalid".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateRequest' }
      responses:
        '200':
          description: A produced verdict — valid (ValidationReport) or invalid (InvalidValidationReport), discriminated on is_valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'
  /models:
    get:
      operationId: listModels
      tags: [discovery]
      summary: The model deck available on this runner.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [llm, extract, img_gen, search, judgment]
          description: >
            Filter the deck by model category. A value outside the enum is a 422: a
            runner MUST NOT accept a category the protocol does not define, so a
            category that a later protocol version adds is a 422 from a runner of an
            earlier one.
      responses:
        '200':
          description: The model deck.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelDeck' }
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'
  /version:
    get:
      operationId: getVersion
      tags: [discovery]
      summary: Protocol and runner versions.
      security: [] # always public — used for handshake/feature detection
      responses:
        '200':
          description: Version info.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
        default:
          $ref: '#/components/responses/Problem'
  /blobs/missing:
    post:
      operationId: findMissingBlobs
      tags: [blobs]
      summary: Which of these blobs the runner lacks, and where to upload each.
      description: >
        OPTIONAL — served by a runner whose /version declares blob_store true. The
        answer lists every blob of the request the runner does not hold, each with an
        upload target; a blob it holds is left out, and an empty list means there is
        nothing to upload. The optional digest names the tree the blobs make up: a
        runner that records the trees it has held in full, recording one only after
        checking it holds every file the tree's listing names and never taking an
        uploaded blob as such a record, MAY answer an empty list when it holds the tree
        that digest names. A hash given twice with different sizes, or a blob past the
        runner's limits, is a 422, refused before anything is uploaded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MissingBlobsRequest' }
      responses:
        '200':
          description: The blobs of the request the runner does not hold, each with where to upload it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissingBlobsResult' }
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'
  /blobs/{sha256}:
    put:
      operationId: putBlob
      tags: [blobs]
      summary: Upload one blob's bytes to a runner that stores them itself.
      description: >
        OPTIONAL — served by a runner that keeps a blob store and stores uploaded
        bytes itself, as the upload target its POST /blobs/missing answers name. The
        body is the blob's bytes and nothing else. A body whose SHA-256 differs from the
        path is a 422. A blob is written once and never changed, so uploading bytes the
        runner already holds succeeds without changing anything.
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          description: The SHA-256 of the body, in lowercase hexadecimal.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: The blob is stored, now or already.
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token semantics are implementation-defined.
  responses:
    Problem:
      description: RFC 7807 problem document.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationProblem:
      description: >
        The request failed validation (RFC 7807). On /execute and /start a bad
        bundle also lands here; on /validate an invalid bundle is a 200 verdict,
        so there a 422 is request-shape only. A request whose files map is not a
        tree is a 422 naming the offending path, and a request naming a hash entry
        the runner does not hold, or any hash entry when it keeps no blob store, is
        a 422 whose missing_blobs member lists each such hash.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    RunRequest:
      type: object
      description: >
        At least one of pipe_code / files is required (enforced by the anyOf rule
        below). If files is provided without pipe_code, the run starts at the
        manifest's main_pipe when the tree holds a METHODS.toml at its root, or else,
        in a method with no manifest, at the one main_pipe its bundles declare; a tree
        whose manifest declares none, or with no manifest whose bundles declare none
        or several, is a 422 naming its bundles by their tree paths. Extension-open:
        implementations MAY accept extra top-level properties (extension args).
      additionalProperties: true
      anyOf:
        - required: [pipe_code]
          properties:
            pipe_code: { type: string, minLength: 1 }
        - required: [files]
          properties:
            files: { $ref: '#/components/schemas/MethodFiles' }
      properties:
        pipe_code:
          type: [string, 'null']
          description: Code of the pipe to execute (a pipe the runner already holds, or one defined in a bundle of files).
        files:
          description: The method to load, as its whole method tree. Implementations bound a file's size, the tree's file count and total size, and the total of the inline entries.
          anyOf:
            - $ref: '#/components/schemas/MethodFiles'
            - type: 'null'
        inputs:
          type: [object, 'null']
          description: 'Method inputs: map of input name to { concept, content }. Content shapes follow the concept''s structure; content validation is deliberately loose here and strict inside the runtime.'
          additionalProperties:
            type: object
            required: [concept, content]
            properties:
              concept: { type: string }
              content: {}
        output_name:
          type: [string, 'null']
          description: Name of the output slot to return as the main output.
        output_multiplicity:
          oneOf: [{ type: boolean }, { type: integer }, { type: 'null' }]
          description: Output multiplicity override (false/true or an explicit count).
        dynamic_output_concept_ref:
          type: [string, 'null']
          description: Override for the dynamic output concept reference.
    RunResultExecute:
      type: object
      description: >
        POST /execute 200 — the completed run. Two base fields: the
        server-generated authoritative pipeline_run_id and the method's
        pipe_output (always present — a completed run has output, either a value
        or an explicit absence document). Extension-open:
        anything more an implementation returns (a run state, timestamps, output
        naming) is an extension on top.
      additionalProperties: true
      required: [pipeline_run_id, pipe_output]
      properties:
        pipeline_run_id:
          type: string
          description: The run identifier — server-generated and authoritative.
        pipe_output:
          description: The method's serialized output (working memory of serialized stuffs).
          type: object
    RunResultStart:
      type: object
      description: >
        POST /start 202 (and the optional /execute 202 degrade) — the started
        run's authoritative pipeline_run_id, nothing else. A started run has no
        output yet; how it is delivered later (polling, callbacks, anything else)
        is implementation-defined and outside the protocol. Extension-open.
      additionalProperties: true
      required: [pipeline_run_id]
      properties:
        pipeline_run_id:
          type: string
          description: The run identifier — server-generated and authoritative.
    ValidateRequest:
      type: object
      required: [files]
      properties:
        files:
          $ref: '#/components/schemas/MethodFiles'
          description: The method to validate, as its whole method tree; the runner judges every bundle and every file a bundle names.
        allow_signatures:
          type: boolean
          default: false
          description: When true, the validation sweep tolerates unimplemented pipe signatures (signatures dry-run by minting a mock). Strict by default.
    ValidationResult:
      description: >
        The 200 response of POST /validate — a produced verdict discriminated on
        the mandatory is_valid field. A client pattern-matches is_valid to learn
        the verdict; it never inspects a status code or catches an exception body.
        Non-2xx is a no-verdict condition (a request-shape problem, auth, a server
        fault), never an invalid bundle.
      oneOf:
        - $ref: '#/components/schemas/ValidationReport'
        - $ref: '#/components/schemas/InvalidValidationReport'
    ValidationReport:
      type: object
      description: >
        The is_valid:true arm of the validate response — the bundle is valid. The
        protocol declares only the is_valid discriminant and the runnability facts;
        implementations MAY include their own artifacts (parsed structures, graphs,
        anything else) as additional properties.
      required: [is_valid, is_runnable, pending_signatures]
      additionalProperties: true
      properties:
        is_valid:
          type: boolean
          enum: [true]
          description: Discriminant — the bundle is valid.
        is_runnable:
          type: boolean
          description: >
            Whether the validated library is complete enough to run — false when
            pipe signatures remain unimplemented (a runnability fact, not an error).
        pending_signatures:
          type: array
          items: { type: string }
          description: Refs of pipes still declared as unimplemented signatures.
    ValidationError:
      type: object
      description: >
        One structured diagnostic on an invalid verdict. The protocol fixes only
        the neutral category + message; an implementation narrows category to its
        own vocabulary and adds locators (the owning source, a pipe/concept code,
        a field name) as additional properties.
      required: [category, message]
      additionalProperties: true
      properties:
        category: { type: string, description: Implementation-defined diagnostic category. }
        message: { type: string }
    InvalidValidationReport:
      type: object
      description: >
        The is_valid:false arm of the validate response — the bundle is invalid. An
        invalid bundle is the successful product of a diagnostic call, not a
        transport failure, so it rides a 200. The structural artifacts of a valid
        report do not exist when load/parse/wiring failed, so this arm carries the
        per-error diagnostics and the runnability facts only.
      required: [is_valid, validation_errors, is_runnable]
      additionalProperties: true
      properties:
        is_valid:
          type: boolean
          enum: [false]
          description: Discriminant — the bundle is invalid.
        validation_errors:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ValidationError' }
          description: Per-error diagnostics — non-empty on every invalid verdict.
        pending_signatures:
          type: array
          items: { type: string }
          description: Outstanding signatures (best-effort; empty when no library could be assembled).
        is_runnable:
          type: boolean
          enum: [false]
          description: An invalid bundle is never runnable.
        message:
          type: string
          description: Human-readable summary of the verdict.
    ModelDeck:
      type: object
      description: >
        The models this runner can route to. Implementations MAY add their own
        routing metadata (aliases, fallback chains, anything else) as
        additional properties — on the deck and on each model entry. A model of a
        family the protocol does not define, such as a vendor's own operator, is
        reported, if at all, under an extension property of the runner's choosing,
        never under an invented category and never as an entry of models without
        one.
      additionalProperties: true
      properties:
        models:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              name: { type: string }
              type:
                type: string
                enum: [llm, extract, img_gen, search, judgment]
                description: >
                  The model's category: the inline settings family of the language
                  that the model serves, and so the pipes that can name it, as the
                  table under "Model categories" on the protocol page states. A
                  runner MUST NOT emit a value outside this enum. A client reading a
                  model list MUST NOT fail it because an entry carries a category it
                  does not recognize; it keeps that entry with its raw value or
                  leaves it out. The enum is the emitter's contract: a client that
                  derives its types or its validation from this document widens
                  this field to any string.
    VersionInfo:
      type: object
      description: >
        The handshake. The protocol defines protocol_version (required) plus an
        optional runner_version and an optional blob_store flag; implementations MAY
        add their own identification (a name, an underlying runtime version, anything
        else) as additional properties.
      required: [protocol_version]
      additionalProperties: true
      properties:
        protocol_version: { type: string, description: MTHDS Protocol version implemented. }
        runner_version: { type: [string, 'null'], description: Version of the runner serving this protocol (optional). }
        blob_store:
          type: boolean
          default: false
          description: >
            True when the runner keeps a blob store: it serves POST /blobs/missing and
            resolves hash entries in a files map. False or absent when it does not, in
            which case it answers any hash entry with a 422 listing missing_blobs.
    MethodFiles:
      type: object
      description: >
        A method tree, as a map from tree path to file entry, holding every file of the
        tree. Each key is a tree path: a relative POSIX path already in Unicode NFC
        (a key that is not is refused, never normalized), with no
        empty, '.' or '..' segment, no segment starting with a dot, no backslash, colon
        or control character, at most 255 UTF-8 bytes per segment and 1024 for the
        path; no segment names a __pycache__ or node_modules directory, no key names
        a file called pyvenv.cfg, no key names a file called METHODS.toml anywhere
        but at the root, and no key is inputs.json or inputs.toml, a run's inputs
        file at the root, all of which the membership rule never admits. No key is given
        twice, as written or once its JSON escapes are decoded. No two keys collide,
        and no key collides with a directory of another, under Unicode full case
        folding (the entries of status C and F in the CaseFolding.txt of Unicode 14.0
        or later, with no locale tailoring) of the key in NFC, normalized to NFC
        again, so neither README.md
        and readme.md, nor straße.txt and STRASSE.txt, nor Templates and
        templates/letter.html share one map. The pattern below checks the
        characters and segments; the other rules are checked by the runner, which
        answers a map breaking any of them with a 422 naming the path.
      minProperties: 1
      propertyNames:
        pattern: '^[^/\\:\x00-\x1F\x7F-\x9F.][^/\\:\x00-\x1F\x7F-\x9F]*(/[^/\\:\x00-\x1F\x7F-\x9F.][^/\\:\x00-\x1F\x7F-\x9F]*)*$'
        maxLength: 1024
      additionalProperties: { $ref: '#/components/schemas/FileEntry' }
    FileEntry:
      description: >
        One file of a method tree: its text, its bytes in Base64, or the hash of bytes
        the runner already holds. There is no URL form, and an entry object that
        gives one of its keys twice is refused, as a key given twice in the map is.
      oneOf:
        - type: string
          description: The file's text. Its bytes are the UTF-8 encoding of this string, exactly.
        - $ref: '#/components/schemas/Base64FileEntry'
        - $ref: '#/components/schemas/HashFileEntry'
    Base64FileEntry:
      type: object
      description: >
        Any bytes, in the standard Base64 alphabet of RFC 4648, padded, with no line
        breaks, and canonical as RFC 4648 section 3.5 defines it: an encoding whose
        pad bits are not zero is not valid Base64 and is refused.
      required: [base64]
      additionalProperties: false
      properties:
        base64: { type: string, contentEncoding: base64 }
    HashFileEntry:
      type: object
      description: >
        Bytes the runner already holds in its blob store, named by their SHA-256 and
        their length. A runner that does not hold them, holds them with another size,
        or keeps no blob store answers with a 422 listing missing_blobs.
      required: [sha256, size]
      additionalProperties: false
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: The SHA-256 of the bytes, in lowercase hexadecimal. }
        size:
          type: integer
          minimum: 0
          description: >
            The length of the bytes, a JSON integer written without a fraction or an
            exponent. A size written 13.0 is refused, although JSON Schema's integer
            type admits it.
    BlobRef:
      type: object
      description: A blob, named by its SHA-256 in lowercase hexadecimal and its length in bytes.
      required: [sha256, size]
      additionalProperties: false
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size:
          type: integer
          minimum: 0
          description: >
            The length of the bytes, a JSON integer written without a fraction or an
            exponent. A size written 13.0 is refused, although JSON Schema's integer
            type admits it.
    MissingBlobsRequest:
      type: object
      description: The blobs a sender is about to send by hash, and optionally the tree they make up.
      required: [blobs]
      additionalProperties: true
      properties:
        blobs:
          type: array
          items: { $ref: '#/components/schemas/BlobRef' }
          description: The blobs to check, each hash listed once.
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: The tree digest of the method tree the blobs make up (optional).
    MissingBlobsResult:
      type: object
      description: The blobs of the request the runner does not hold. Extension-open.
      required: [missing]
      additionalProperties: true
      properties:
        missing:
          type: array
          items: { $ref: '#/components/schemas/MissingBlob' }
    MissingBlob:
      type: object
      description: A blob the runner lacks, with where to upload it.
      required: [sha256, size, upload]
      additionalProperties: true
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size:
          type: integer
          minimum: 0
          description: >
            The length of the bytes, a JSON integer written without a fraction or an
            exponent. A size written 13.0 is refused, although JSON Schema's integer
            type admits it.
        upload: { $ref: '#/components/schemas/UploadTarget' }
    UploadTarget:
      type: object
      description: >
        Where to upload one blob. The sender sends the blob's bytes as the whole body of
        a request with this method to this URL, carrying exactly these headers. The
        target is the runner's choice: its own PUT /blobs/{sha256}, or any address that
        stores the bytes where the runner reads its blobs.
      required: [method, url, headers]
      additionalProperties: true
      properties:
        method: { type: string, description: 'The HTTP method, such as PUT.' }
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
          description: The headers to send, exactly.
    Problem:
      type: object
      description: RFC 7807.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        missing_blobs:
          type: array
          items: { type: string, pattern: '^[0-9a-f]{64}$' }
          description: >
            On a 422 refusing hash entries, every hash of the request the runner does
            not hold, in lowercase hexadecimal, so a sender learns in one answer what to
            upload.
